name: EShot Overlay Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.2
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_msvc2022_64

      - name: Build EShot x64 Release
        shell: cmd
        env:
          QT_DIR: ${{ steps.qt.outputs.qt-dir }}
        run: |
          mkdir build 2>nul
          build.bat > build\build-log.txt 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EShot-build-log
          path: build/build-log.txt

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EShot-overlay-windows-x64
          path: dist\bin
